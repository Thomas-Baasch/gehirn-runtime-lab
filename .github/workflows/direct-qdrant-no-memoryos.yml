name: Direct Qdrant No MemoryOS Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "requests/direct-qdrant-no-memoryos-*.txt"

permissions:
  contents: read

jobs:
  direct-no-memoryos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install direct backend only
        run: python -m pip install "qdrant-client==1.16.0"
      - name: Verify MemoryOS is absent and Qdrant is pinned
        run: |
          python - <<'PY'
          import importlib.metadata as m, importlib.util
          assert m.version('qdrant-client') == '1.16.0'
          assert importlib.util.find_spec('memos') is None
          try:
              m.distribution('MemoryOS')
          except m.PackageNotFoundError:
              pass
          else:
              raise AssertionError('MemoryOS unexpectedly installed')
          PY
      - name: Syntax-check isolated direct path
        env:
          PYTHONPATH: .
        run: python -m py_compile governance/memos_composition.py governance/memos_recovery.py governance/direct_qdrant_index.py critical/direct_qdrant_full_exchange_gate.py critical/direct_qdrant_no_memoryos_gate.py
      - name: Execute unchanged 12/12 + 8/8 with no MemoryOS installed
        env:
          PYTHONPATH: .
        run: python critical/direct_qdrant_no_memoryos_gate.py
      - name: Upload isolated direct evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-qdrant-no-memoryos-evidence
          path: reports/direct_exchange/
          if-no-files-found: error

  memos-regression-after-lazy-import:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact MemOS release and pinned Qdrant
        run: |
          python -m pip install "git+https://github.com/MemTensor/MemOS.git@f4db521214c29337164ec788bafede7eab236c25"
          python -m pip install "qdrant-client==1.16.0"
      - name: Verify candidate identity
        run: |
          python -c "import importlib.metadata as m; assert m.version('MemoryOS') == '2.0.30'"
          python -c "import importlib.metadata as m; assert m.version('qdrant-client') == '1.16.0'"
      - name: Regress MemOS critical six after lazy-import refactor
        env:
          PYTHONPATH: .
        run: python critical/governance_memos_composed_gate.py
      - name: Regress MemOS remaining six after lazy-import refactor
        env:
          PYTHONPATH: .
        run: python critical/governance_memos_remaining_gate.py
      - name: Regress MemOS recovery eight after lazy-import refactor
        env:
          PYTHONPATH: .
        run: python critical/governance_memos_recovery_gate.py
      - name: Upload MemOS regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memos-regression-after-lazy-import-evidence
          path: reports/composed/
          if-no-files-found: error
