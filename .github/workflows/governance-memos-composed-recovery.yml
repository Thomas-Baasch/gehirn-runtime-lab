name: Governance MemOS Composed Recovery Hard Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "requests/governance-memos-recovery-*.txt"

permissions:
  contents: read

jobs:
  composed-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact MemOS release commit
        run: python -m pip install "git+https://github.com/MemTensor/MemOS.git@f4db521214c29337164ec788bafede7eab236c25"
      - name: Install pinned local Qdrant dependency
        run: python -m pip install "qdrant-client==1.16.0"
      - name: Verify candidate runtime identity
        run: |
          python -c "import importlib.metadata as m; assert m.version('MemoryOS') == '2.0.30'"
          python -c "import importlib.metadata as m; assert m.version('qdrant-client') == '1.16.0'"
      - name: Syntax-check recovery layer and gate
        env:
          PYTHONPATH: .
        run: python -m py_compile governance/memos_recovery.py critical/governance_memos_recovery_gate.py
      - name: Regression-check composed critical six
        env:
          PYTHONPATH: .
        run: python critical/governance_memos_composed_gate.py
      - name: Regression-check composed remaining six
        env:
          PYTHONPATH: .
        run: python critical/governance_memos_remaining_gate.py
      - name: Execute composed recovery and fault-injection gate
        env:
          PYTHONPATH: .
        run: python critical/governance_memos_recovery_gate.py
      - name: Upload critical regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-memos-recovery-critical-regression-evidence
          path: reports/composed/governance_memos_critical.json
          if-no-files-found: error
      - name: Upload remaining regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-memos-recovery-remaining-regression-evidence
          path: reports/composed/governance_memos_remaining.json
          if-no-files-found: error
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-memos-composed-recovery-evidence
          path: reports/composed/governance_memos_recovery.json
          if-no-files-found: error
