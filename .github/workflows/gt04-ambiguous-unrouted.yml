name: GT04 Ambiguous Unrouted Strict Router Probe

on:
  pull_request:
    branches: [main]
    paths:
      - "requests/gt04-ambiguous-*.txt"

permissions:
  contents: read

jobs:
  slm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download exact SLM wheel and verify frozen SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          python -m pip download --no-deps --only-binary=:all: superlocalmemory==4.0.8 -d downloads
          WHEEL="$(find downloads -maxdepth 1 -name 'superlocalmemory-4.0.8-*.whl' -print -quit)"
          test -n "$WHEEL"
          printf '%s  %s\n' 'ed93780073c6a388dd26e0229609266fe7cd9475e72d9fac10c1d5005d1e1aef' "$WHEEL" | sha256sum --check -
          python -m pip install --no-deps "$WHEEL"
      - name: Install minimal route-model dependencies
        run: python -m pip install "fastapi==0.139.2"
      - name: Run SLM GT-04 probe
        run: python critical/gt04_ambiguous_unrouted.py --candidate slm --output reports/critical/gt04_slm.json
      - uses: actions/upload-artifact@v4
        with:
          name: gt04-slm-evidence
          path: reports/critical/gt04_slm.json

  memos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact MemOS release commit
        run: python -m pip install "git+https://github.com/MemTensor/MemOS.git@f4db521214c29337164ec788bafede7eab236c25"
      - name: Run MemOS GT-04 probe
        run: python critical/gt04_ambiguous_unrouted.py --candidate memos --output reports/critical/gt04_memos.json
      - uses: actions/upload-artifact@v4
        with:
          name: gt04-memos-evidence
          path: reports/critical/gt04_memos.json

  everos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact EverOS release commit
        run: python -m pip install "git+https://github.com/EverMind-AI/EverOS.git@48fc9084888bc17100053227284f939a5aca5e91"
      - name: Run EverOS GT-04 probe
        run: python critical/gt04_ambiguous_unrouted.py --candidate everos --output reports/critical/gt04_everos.json
      - uses: actions/upload-artifact@v4
        with:
          name: gt04-everos-evidence
          path: reports/critical/gt04_everos.json
