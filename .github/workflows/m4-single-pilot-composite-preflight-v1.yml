name: M4 Single Pilot Composite Preflight V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'governance/m4_single_pilot_composite_preflight.py'
      - 'critical/m4_single_pilot_composite_preflight_v1_gate.py'
      - '.github/workflows/m4-single-pilot-composite-preflight-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m4-single-pilot-composite-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile governance/m4_single_pilot_composite_preflight.py critical/m4_single_pilot_composite_preflight_v1_gate.py
      - name: Regression M4 home-system eligibility V1
        run: python critical/m4_home_system_eligibility_gate.py
      - name: Regression M5 durable ledger V1
        run: python critical/durable_continuation_ledger_v1_gate.py
      - name: Regression M5 downstream reconciliation V1
        run: python critical/m5_downstream_reconciliation_v1_gate.py
      - name: Regression M5 post-dispatch run heartbeat V1
        run: python critical/m5_post_dispatch_run_heartbeat_v1_gate.py
      - name: Regression M5 GitHub Actions run evidence adapter V1
        run: python critical/m5_github_actions_run_evidence_adapter_v1_gate.py
      - name: Regression M5 downstream outcome artifact evidence V1
        run: python critical/m5_downstream_outcome_artifact_evidence_v1_gate.py
      - name: Execute frozen M4 composite preflight gate
        run: python critical/m4_single_pilot_composite_preflight_v1_gate.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-single-pilot-composite-preflight-v1-evidence
          path: |
            reports/continuation/m4_home_system_eligibility.json
            reports/continuation/durable_continuation_ledger_v1.json
            reports/continuation/m5_downstream_reconciliation_v1.json
            reports/continuation/m5_post_dispatch_run_heartbeat_v1.json
            reports/continuation/m5_github_actions_run_evidence_adapter_v1.json
            reports/continuation/m5_downstream_outcome_artifact_evidence_v1.json
            reports/continuation/m4_single_pilot_composite_preflight_v1.json
          if-no-files-found: error
