name: MemOS GT08 Native Conflict Controls

on:
  pull_request:
    branches: [main]
    paths:
      - "requests/memos-gt08-*.txt"

permissions:
  contents: read

jobs:
  memos-gt08:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact MemTensor MemOS release commit
        run: >-
          python -m pip install
          "git+https://github.com/MemTensor/MemOS.git@f4db521214c29337164ec788bafede7eab236c25"
      - name: Verify runtime distribution identity
        run: python -c "import importlib.metadata as m; assert m.version('MemoryOS') == '2.0.30'; import memos"
      - name: Execute native GT-08 safe-mode and negative controls
        run: python critical/memos_gt08_controls.py
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memos-gt08-native-evidence
          path: reports/critical/memos_gt08_controls.json
          if-no-files-found: error
