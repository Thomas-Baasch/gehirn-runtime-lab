name: One-shot public branch cleanup

on:
  push:
    branches: [main]
    paths: [".github/workflows/one-shot-selfrunner-branch-cleanup.yml"]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete superseded public SelfRunner branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          status=$(curl -sS -o /tmp/out -w "%{http_code}"             -X DELETE             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/git/refs/heads/selfrunner-provider-core-v1")
          if [ "$status" != "204" ] && [ "$status" != "422" ]; then
            cat /tmp/out
            exit 1
          fi
          echo "cleanup_status=$status"
