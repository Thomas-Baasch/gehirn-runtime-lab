name: Pre-SL6 Combined Interaction Regression

on:
  push:
    branches:
      - runtime/pre-sl6-combined-regression-001

permissions:
  actions: read
  contents: read

jobs:
  combined-regression:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact combined regression commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.7'
      - name: Five-loop combined regression
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile pre_sl6_combined/router.py pre_sl6_combined/acceptance.py critical/pre_sl6_combined_formal.py
          mkdir -p reports/safe_live/pre_sl6_combined
          python -m pre_sl6_combined.acceptance --out reports/safe_live/pre_sl6_combined/primary.json | tee /tmp/pre-sl6-primary.log
          grep -Fx 'PRE_SL6_COMBINED=PASS' /tmp/pre-sl6-primary.log
          grep -Fx 'PRE_SL6_LOOP_1=PASS' /tmp/pre-sl6-primary.log
          grep -Fx 'PRE_SL6_LOOP_2=PASS' /tmp/pre-sl6-primary.log
          grep -Fx 'PRE_SL6_LOOP_3=PASS' /tmp/pre-sl6-primary.log
          grep -Fx 'PRE_SL6_LOOP_4=PASS' /tmp/pre-sl6-primary.log
          grep -Fx 'PRE_SL6_LOOP_5=PASS' /tmp/pre-sl6-primary.log
          grep -Fx 'PRE_SL6_CLEAN_1=LOOP_4' /tmp/pre-sl6-primary.log
          grep -Fx 'PRE_SL6_CLEAN_2=LOOP_5' /tmp/pre-sl6-primary.log
          grep -Fx 'PRE_SL6_TWO_CONSECUTIVE_CLEAN=true' /tmp/pre-sl6-primary.log
          grep -Fx 'PRE_SL6_EXECUTE=false' /tmp/pre-sl6-primary.log
          grep -Fx 'PRE_SL6_DRIVE_WRITES=0' /tmp/pre-sl6-primary.log
          grep -Fx 'PRE_SL6_GITHUB_WRITES=0' /tmp/pre-sl6-primary.log
          grep -Fx 'PRE_SL6_EXTERNAL_ACTIONS=0' /tmp/pre-sl6-primary.log
          grep -Fx 'PRE_SL6_PRODUCTION_WRITES=0' /tmp/pre-sl6-primary.log
          grep -Fx 'PRE_SL6_SL6_AUTHORIZED=false' /tmp/pre-sl6-primary.log
          sha256sum reports/safe_live/pre_sl6_combined/primary.json
      - name: Persist primary evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre-sl6-combined-primary-${{ github.run_id }}
          path: reports/safe_live/pre_sl6_combined/
          retention-days: 2

  formal-readback:
    needs: combined-regression
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout independent formal evaluator
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.7'
      - name: Download unchanged primary evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pre-sl6-combined-primary-${{ github.run_id }}
          path: /tmp/pre-sl6-primary
      - name: Independent formal readback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/safe_live/pre_sl6_combined_formal
          python critical/pre_sl6_combined_formal.py \
            --primary /tmp/pre-sl6-primary/primary.json \
            --workflow .github/workflows/pre-sl6-combined-regression.yml \
            --out reports/safe_live/pre_sl6_combined_formal/formal.json | tee /tmp/pre-sl6-formal.log
          grep -Fx 'PRE_SL6_COMBINED_FORMAL=PASS' /tmp/pre-sl6-formal.log
          grep -Fx 'PRE_SL6_LOOP_1=PASS' /tmp/pre-sl6-formal.log
          grep -Fx 'PRE_SL6_LOOP_2=PASS' /tmp/pre-sl6-formal.log
          grep -Fx 'PRE_SL6_LOOP_3=PASS' /tmp/pre-sl6-formal.log
          grep -Fx 'PRE_SL6_LOOP_4=PASS' /tmp/pre-sl6-formal.log
          grep -Fx 'PRE_SL6_LOOP_5=PASS' /tmp/pre-sl6-formal.log
          grep -Fx 'PRE_SL6_CLEAN_1=LOOP_4' /tmp/pre-sl6-formal.log
          grep -Fx 'PRE_SL6_CLEAN_2=LOOP_5' /tmp/pre-sl6-formal.log
          grep -Fx 'PRE_SL6_TWO_CONSECUTIVE_CLEAN=true' /tmp/pre-sl6-formal.log
          grep -Fx 'PRE_SL6_EXECUTE=false' /tmp/pre-sl6-formal.log
          grep -Fx 'PRE_SL6_DRIVE_WRITES=0' /tmp/pre-sl6-formal.log
          grep -Fx 'PRE_SL6_GITHUB_WRITES=0' /tmp/pre-sl6-formal.log
          grep -Fx 'PRE_SL6_EXTERNAL_ACTIONS=0' /tmp/pre-sl6-formal.log
          grep -Fx 'PRE_SL6_PRODUCTION_WRITES=0' /tmp/pre-sl6-formal.log
          grep -Fx 'PRE_SL6_SL6_AUTHORIZED=false' /tmp/pre-sl6-formal.log
          sha256sum reports/safe_live/pre_sl6_combined_formal/formal.json
      - name: Persist formal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre-sl6-combined-formal-${{ github.run_id }}
          path: reports/safe_live/pre_sl6_combined_formal/
          retention-days: 2
