name: Runtime Bootstrap Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runtime-bootstrap.yml"
      - "runtime/**"

permissions:
  contents: read

jobs:
  superlocalmemory:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare pip
        run: python -m pip install --upgrade pip
      - name: Install exact SLM wheel and verify SHA-256
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          python -m pip download --no-deps --only-binary=:all: superlocalmemory==4.0.8 -d downloads
          WHEEL="$(find downloads -maxdepth 1 -name 'superlocalmemory-4.0.8-*.whl' -print -quit)"
          test -n "$WHEEL"
          printf '%s  %s\n' 'ed93780073c6a388dd26e0229609266fe7cd9475e72d9fac10c1d5005d1e1aef' "$WHEEL" | sha256sum --check -
          python -m pip install "$WHEEL"
      - name: Probe SLM runtime identity
        id: probe
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: >-
          python runtime/bootstrap_probe.py
          --candidate SuperLocalMemory
          --distribution superlocalmemory
          --module superlocalmemory
          --expected-version 4.0.8
          --source-pin "tag-commit:a5438ee6028c9bd7ca30959a3d61d133c24592ed;wheel-sha256:ed93780073c6a388dd26e0229609266fe7cd9475e72d9fac10c1d5005d1e1aef"
          --output reports/bootstrap/superlocalmemory.json
      - name: Record SLM install blocker
        if: steps.install.outcome != 'success'
        run: >-
          python runtime/failure_report.py
          --candidate SuperLocalMemory
          --distribution superlocalmemory
          --expected-version 4.0.8
          --source-pin "tag-commit:a5438ee6028c9bd7ca30959a3d61d133c24592ed;wheel-sha256:ed93780073c6a388dd26e0229609266fe7cd9475e72d9fac10c1d5005d1e1aef"
          --stage INSTALL
          --output reports/bootstrap/superlocalmemory.json
      - name: Upload SLM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-superlocalmemory
          path: reports/bootstrap/superlocalmemory.json
          if-no-files-found: error
      - name: Enforce SLM bootstrap gate
        if: always()
        shell: bash
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.probe.outcome }}" = "success"

  memos:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare pip
        run: python -m pip install --upgrade pip
      - name: Install exact MemTensor MemOS release commit
        id: install
        continue-on-error: true
        run: >-
          python -m pip install
          "git+https://github.com/MemTensor/MemOS.git@f4db521214c29337164ec788bafede7eab236c25"
      - name: Probe MemOS runtime identity
        id: probe
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: >-
          python runtime/bootstrap_probe.py
          --candidate MemTensor-MemOS
          --distribution MemoryOS
          --module memos
          --expected-version 2.0.30
          --source-pin "release-v2.0.30;commit:f4db521214c29337164ec788bafede7eab236c25"
          --output reports/bootstrap/memos.json
      - name: Record MemOS install blocker
        if: steps.install.outcome != 'success'
        run: >-
          python runtime/failure_report.py
          --candidate MemTensor-MemOS
          --distribution MemoryOS
          --expected-version 2.0.30
          --source-pin "release-v2.0.30;commit:f4db521214c29337164ec788bafede7eab236c25"
          --stage INSTALL
          --output reports/bootstrap/memos.json
      - name: Upload MemOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-memos
          path: reports/bootstrap/memos.json
          if-no-files-found: error
      - name: Enforce MemOS bootstrap gate
        if: always()
        shell: bash
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.probe.outcome }}" = "success"

  everos:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare pip
        run: python -m pip install --upgrade pip
      - name: Install exact EverOS release commit
        id: install
        continue-on-error: true
        run: >-
          python -m pip install
          "git+https://github.com/EverMind-AI/EverOS.git@48fc9084888bc17100053227284f939a5aca5e91"
      - name: Probe EverOS runtime identity
        id: probe
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: >-
          python runtime/bootstrap_probe.py
          --candidate EverOS
          --distribution everos
          --module everos
          --expected-version 1.2.3
          --source-pin "release-v1.2.3;commit:48fc9084888bc17100053227284f939a5aca5e91"
          --output reports/bootstrap/everos.json
      - name: Record EverOS install blocker
        if: steps.install.outcome != 'success'
        run: >-
          python runtime/failure_report.py
          --candidate EverOS
          --distribution everos
          --expected-version 1.2.3
          --source-pin "release-v1.2.3;commit:48fc9084888bc17100053227284f939a5aca5e91"
          --stage INSTALL
          --output reports/bootstrap/everos.json
      - name: Upload EverOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-everos
          path: reports/bootstrap/everos.json
          if-no-files-found: error
      - name: Enforce EverOS bootstrap gate
        if: always()
        shell: bash
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.probe.outcome }}" = "success"
