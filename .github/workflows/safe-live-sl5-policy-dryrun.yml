name: Safe-Live SL5 narrow policy dry-run acceptance

on:
  push:
    branches:
      - runtime/safe-live-sl5-policy-dryrun-001

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  dry-run:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact SL5 dry-run commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.7'
      - name: Syntax and frozen local tests
        run: |
          set -euo pipefail
          python -m py_compile safe_live_sl5/dryrun_policy.py safe_live_sl5/acceptance.py critical/safe_live_sl5_policy_formal.py
          python - <<'PY'
          import tests.test_safe_live_sl5_policy as t
          for name in sorted(n for n in dir(t) if n.startswith('test_loop_')):
              getattr(t, name)()
              print(f'{name}=PASS')
          PY
      - name: Read exact current Issue 42 state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sl5-current reports/safe_live/sl5_policy_dryrun
          gh api "repos/${REPO}/issues/42" > /tmp/sl5-current/issue.json
          gh api "repos/${REPO}/issues/42/comments" > /tmp/sl5-current/comments.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/sl5-current')
          issue=json.loads((p/'issue.json').read_text())
          comments=json.loads((p/'comments.json').read_text())
          out={
            'repo':'Thomas-Baasch/gehirn-runtime-lab',
            'number':issue['number'],
            'title':issue['title'],
            'state':issue['state'],
            'updated_at':issue['updated_at'],
            'comment_bodies':[c.get('body') or '' for c in comments],
          }
          (p/'current.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          PY
      - name: Execute real-current five-loop dry-run acceptance
        run: |
          set -euo pipefail
          python safe_live_sl5/acceptance.py \
            --policy safe_live_sl5/policy_v0_1.json \
            --current /tmp/sl5-current/current.json \
            --out reports/safe_live/sl5_policy_dryrun/primary.json | tee /tmp/sl5-primary.log
          grep -Fx 'SAFE_LIVE_SL5_DRYRUN=PASS' /tmp/sl5-primary.log
          grep -Fx 'SAFE_LIVE_SL5_LOOP_1=PASS' /tmp/sl5-primary.log
          grep -Fx 'SAFE_LIVE_SL5_LOOP_2=PASS' /tmp/sl5-primary.log
          grep -Fx 'SAFE_LIVE_SL5_LOOP_3=PASS' /tmp/sl5-primary.log
          grep -Fx 'SAFE_LIVE_SL5_LOOP_4=PASS' /tmp/sl5-primary.log
          grep -Fx 'SAFE_LIVE_SL5_LOOP_5=PASS' /tmp/sl5-primary.log
          grep -Fx 'SAFE_LIVE_SL5_CLEAN_1=LOOP_4' /tmp/sl5-primary.log
          grep -Fx 'SAFE_LIVE_SL5_CLEAN_2=LOOP_5' /tmp/sl5-primary.log
          grep -Fx 'SAFE_LIVE_SL5_TWO_CONSECUTIVE_CLEAN=true' /tmp/sl5-primary.log
          grep -Fx 'SAFE_LIVE_SL5_EXECUTE=false' /tmp/sl5-primary.log
          grep -Fx 'SAFE_LIVE_SL5_EXTERNAL_ACTIONS=0' /tmp/sl5-primary.log
          grep -Fx 'SAFE_LIVE_SL5_PRODUCTION_WRITES=0' /tmp/sl5-primary.log
          grep -Fx 'SAFE_LIVE_SL5_ACTIVATION_AUTHORIZED=false' /tmp/sl5-primary.log
          sha256sum reports/safe_live/sl5_policy_dryrun/primary.json
      - name: Persist primary dry-run evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safe-live-sl5-policy-primary-${{ github.run_id }}
          path: reports/safe_live/sl5_policy_dryrun/
          retention-days: 2
          if-no-files-found: error

  formal-readback:
    needs: dry-run
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout independent formal evaluator
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.7'
      - name: Download unchanged primary evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: safe-live-sl5-policy-primary-${{ github.run_id }}
          path: /tmp/sl5-primary
      - name: Fresh independent currentness read
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sl5-fresh reports/safe_live/sl5_policy_formal
          gh api "repos/${REPO}/issues/42" > /tmp/sl5-fresh/issue.json
          gh api "repos/${REPO}/issues/42/comments" > /tmp/sl5-fresh/comments.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/sl5-fresh')
          issue=json.loads((p/'issue.json').read_text())
          comments=json.loads((p/'comments.json').read_text())
          out={
            'repo':'Thomas-Baasch/gehirn-runtime-lab',
            'number':issue['number'],
            'title':issue['title'],
            'state':issue['state'],
            'updated_at':issue['updated_at'],
            'comment_bodies':[c.get('body') or '' for c in comments],
          }
          (p/'current.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          PY
      - name: Independent formal reacceptance
        run: |
          set -euo pipefail
          python critical/safe_live_sl5_policy_formal.py \
            --primary /tmp/sl5-primary/primary.json \
            --fresh-current /tmp/sl5-fresh/current.json \
            --workflow .github/workflows/safe-live-sl5-policy-dryrun.yml \
            --out reports/safe_live/sl5_policy_formal/formal.json | tee /tmp/sl5-formal.log
          grep -Fx 'SAFE_LIVE_SL5_FORMAL=PASS' /tmp/sl5-formal.log
          grep -Fx 'SAFE_LIVE_SL5_LOOP_1=PASS' /tmp/sl5-formal.log
          grep -Fx 'SAFE_LIVE_SL5_LOOP_2=PASS' /tmp/sl5-formal.log
          grep -Fx 'SAFE_LIVE_SL5_LOOP_3=PASS' /tmp/sl5-formal.log
          grep -Fx 'SAFE_LIVE_SL5_LOOP_4=PASS' /tmp/sl5-formal.log
          grep -Fx 'SAFE_LIVE_SL5_LOOP_5=PASS' /tmp/sl5-formal.log
          grep -Fx 'SAFE_LIVE_SL5_CLEAN_1=LOOP_4' /tmp/sl5-formal.log
          grep -Fx 'SAFE_LIVE_SL5_CLEAN_2=LOOP_5' /tmp/sl5-formal.log
          grep -Fx 'SAFE_LIVE_SL5_TWO_CONSECUTIVE_CLEAN=true' /tmp/sl5-formal.log
          grep -Fx 'SAFE_LIVE_SL5_EXECUTE=false' /tmp/sl5-formal.log
          grep -Fx 'SAFE_LIVE_SL5_EXTERNAL_ACTIONS=0' /tmp/sl5-formal.log
          grep -Fx 'SAFE_LIVE_SL5_PRODUCTION_WRITES=0' /tmp/sl5-formal.log
          grep -Fx 'SAFE_LIVE_SL5_ACTIVATION_AUTHORIZED=false' /tmp/sl5-formal.log
          sha256sum reports/safe_live/sl5_policy_formal/formal.json
      - name: Persist formal dry-run acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safe-live-sl5-policy-formal-${{ github.run_id }}
          path: reports/safe_live/sl5_policy_formal/
          retention-days: 2
          if-no-files-found: error
