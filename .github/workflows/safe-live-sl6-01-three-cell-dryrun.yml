name: Safe-Live SL6-01 Three-Cell Orchestration Dry Run

on:
  push:
    branches:
      - runtime/safe-live-sl6-01-three-cell-dryrun-001

permissions:
  actions: read
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact SL6-01 dry-run commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.7'
      - name: Syntax and five-loop SL6-01 dry-run
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile safe_live_sl6_01/policy.py safe_live_sl6_01/acceptance.py critical/safe_live_sl6_01_three_cell_formal.py
          mkdir -p reports/safe_live/sl6_01_three_cell_dryrun
          python -m safe_live_sl6_01.acceptance --out reports/safe_live/sl6_01_three_cell_dryrun/primary.json | tee /tmp/sl6-01-primary.log
          grep -Fx 'SAFE_LIVE_SL6_01_DRYRUN=PASS' /tmp/sl6-01-primary.log
          grep -Fx 'SAFE_LIVE_SL6_01_LOOP_1=PASS' /tmp/sl6-01-primary.log
          grep -Fx 'SAFE_LIVE_SL6_01_LOOP_2=PASS' /tmp/sl6-01-primary.log
          grep -Fx 'SAFE_LIVE_SL6_01_LOOP_3=PASS' /tmp/sl6-01-primary.log
          grep -Fx 'SAFE_LIVE_SL6_01_LOOP_4=PASS' /tmp/sl6-01-primary.log
          grep -Fx 'SAFE_LIVE_SL6_01_LOOP_5=PASS' /tmp/sl6-01-primary.log
          grep -Fx 'SAFE_LIVE_SL6_01_CLEAN_1=LOOP_4' /tmp/sl6-01-primary.log
          grep -Fx 'SAFE_LIVE_SL6_01_CLEAN_2=LOOP_5' /tmp/sl6-01-primary.log
          grep -Fx 'SAFE_LIVE_SL6_01_TWO_CONSECUTIVE_CLEAN=true' /tmp/sl6-01-primary.log
          grep -Fx 'SAFE_LIVE_SL6_01_EXECUTE=false' /tmp/sl6-01-primary.log
          grep -Fx 'SAFE_LIVE_SL6_01_DRIVE_WRITES=0' /tmp/sl6-01-primary.log
          grep -Fx 'SAFE_LIVE_SL6_01_GITHUB_WRITES=0' /tmp/sl6-01-primary.log
          grep -Fx 'SAFE_LIVE_SL6_01_EXTERNAL_ACTIONS=0' /tmp/sl6-01-primary.log
          grep -Fx 'SAFE_LIVE_SL6_01_PRODUCTION_WRITES=0' /tmp/sl6-01-primary.log
          grep -Fx 'SAFE_LIVE_SL6_01_ACTIVATION_AUTHORIZED=false' /tmp/sl6-01-primary.log
          sha256sum reports/safe_live/sl6_01_three_cell_dryrun/primary.json
      - name: Persist primary evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safe-live-sl6-01-primary-${{ github.run_id }}
          path: reports/safe_live/sl6_01_three_cell_dryrun/
          retention-days: 2

  formal-readback:
    needs: dry-run
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout independent formal evaluator
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.7'
      - name: Download unchanged primary evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: safe-live-sl6-01-primary-${{ github.run_id }}
          path: /tmp/sl6-01-primary
      - name: Independent formal readback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/safe_live/sl6_01_three_cell_formal
          python critical/safe_live_sl6_01_three_cell_formal.py \
            --primary /tmp/sl6-01-primary/primary.json \
            --workflow .github/workflows/safe-live-sl6-01-three-cell-dryrun.yml \
            --out reports/safe_live/sl6_01_three_cell_formal/formal.json | tee /tmp/sl6-01-formal.log
          grep -Fx 'SAFE_LIVE_SL6_01_FORMAL=PASS' /tmp/sl6-01-formal.log
          grep -Fx 'SAFE_LIVE_SL6_01_LOOP_1=PASS' /tmp/sl6-01-formal.log
          grep -Fx 'SAFE_LIVE_SL6_01_LOOP_2=PASS' /tmp/sl6-01-formal.log
          grep -Fx 'SAFE_LIVE_SL6_01_LOOP_3=PASS' /tmp/sl6-01-formal.log
          grep -Fx 'SAFE_LIVE_SL6_01_LOOP_4=PASS' /tmp/sl6-01-formal.log
          grep -Fx 'SAFE_LIVE_SL6_01_LOOP_5=PASS' /tmp/sl6-01-formal.log
          grep -Fx 'SAFE_LIVE_SL6_01_CLEAN_1=LOOP_4' /tmp/sl6-01-formal.log
          grep -Fx 'SAFE_LIVE_SL6_01_CLEAN_2=LOOP_5' /tmp/sl6-01-formal.log
          grep -Fx 'SAFE_LIVE_SL6_01_TWO_CONSECUTIVE_CLEAN=true' /tmp/sl6-01-formal.log
          grep -Fx 'SAFE_LIVE_SL6_01_EXECUTE=false' /tmp/sl6-01-formal.log
          grep -Fx 'SAFE_LIVE_SL6_01_DRIVE_WRITES=0' /tmp/sl6-01-formal.log
          grep -Fx 'SAFE_LIVE_SL6_01_GITHUB_WRITES=0' /tmp/sl6-01-formal.log
          grep -Fx 'SAFE_LIVE_SL6_01_EXTERNAL_ACTIONS=0' /tmp/sl6-01-formal.log
          grep -Fx 'SAFE_LIVE_SL6_01_PRODUCTION_WRITES=0' /tmp/sl6-01-formal.log
          grep -Fx 'SAFE_LIVE_SL6_01_ACTIVATION_AUTHORIZED=false' /tmp/sl6-01-formal.log
          sha256sum reports/safe_live/sl6_01_three_cell_formal/formal.json
      - name: Persist formal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safe-live-sl6-01-formal-${{ github.run_id }}
          path: reports/safe_live/sl6_01_three_cell_formal/
          retention-days: 2
